# /etc/kvm-studio/helper.toml: settings of the privileged helper.
# Owned by root. Users declare their ISO libraries in Preferences; the helper
# keeps those in its state file. Libraries listed here count as well.

# socket = "/run/kvmstudio-helper.sock"
# state = "/var/lib/kvm-studio/helper-state.json"
# swtpm_dir = "/var/lib/libvirt/swtpm"   # TPM states, copied when cloning

# Account QEMU runs as. Detected when absent ("qemu", then "libvirt-qemu").
# qemu_user = "qemu"

