# Installed by the kvm-studio package.
# Keeps KVM Studio bridges (kvmnetN) and VM interfaces (ks-*, and vnet* for
# those libvirt names itself) out of the desktop network applet. virbr* and
# every other interface are left alone. Removed with the package.
#
# A device section, not [keyfile] unmanaged-devices: another file setting that
# key would replace ours (or ours would replace it), while device sections add up.
[device-kvm-studio]
match-device=interface-name:kvmnet*;interface-name:ks-*;interface-name:vnet*
managed=0
