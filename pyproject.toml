# Shared tool settings. The installable packages live in backend/ and helper/.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["kvmstudio"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "backend/stubs:backend"
files = ["backend/kvmstudio", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["gi", "gi.*", "qtpy", "qtpy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["kvmstudio"]
omit = ["*/kvmstudio/shell/desktop.py"]
