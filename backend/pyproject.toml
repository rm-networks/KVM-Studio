[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kvm-studio"
version = "1.0.0.dev0"
description = "Virtual machine manager for Linux, built on libvirt"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# libvirt-python and PyGObject come from the distribution (python3-libvirt,
# python3-gobject), so they are not listed here.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.35,<1",
    "pydantic>=2.7,<3",
    "pywebview>=5,<7",
    # WebSocket support in uvicorn (console proxy, live events).
    "websockets>=12",
    # Domain XML builders; also packaged by every distribution (python3-lxml).
    "lxml>=5",
    # Writes the configuration file from the Preferences screen.
    "tomli-w>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.15",
    "mypy>=1.18",
    "lxml-stubs",
]

[project.scripts]
kvm-studio = "kvmstudio.__main__:main"

[tool.setuptools.packages.find]
include = ["kvmstudio*"]

[tool.setuptools.package-data]
kvmstudio = ["py.typed", "guesttools/files/*/*", "locale/*.json"]
