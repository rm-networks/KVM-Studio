# KVM Studio configuration
# Location: $XDG_CONFIG_HOME/kvm-studio/config.toml (usually ~/.config/kvm-studio/)
# Every key is optional; missing keys take the value shown here.
# Details: docs/CONFIGURATION.md

[interface]
# "desktop" (native window) or "web" (browser). Applied on restart.
mode = "desktop"

[web]
port = 60080         # HTTP, this computer only
https_port = 60443   # HTTPS, for sharing on the local network
# Web mode only: other computers log in with the guest password (set it in
# Edit > Preferences > Interface first, or KVM Studio refuses to start).
share_on_lan = false
tls = "auto"           # self-signed certificate, made at the first start
guest_enabled = true
login_max_attempts = 5 # failed logins from one address before a 5 minute lockout

[libvirt]
uri = "qemu:///system"

[storage]
# Folder where each VM gets its own subfolder. No default: set it here or in
# the first-run assistant.
# vm_default_location = "/srv/vm"

# ISO libraries, browsed read-only. Repeat the block for each folder.
# [[iso_libraries]]
# name = "Main ISO"
# path = "/srv/iso"
# recursive = true
# extensions = [".iso", ".img"]

[defaults]
firmware = "uefi"        # "uefi" | "bios"
disk_bus = "virtio"      # "virtio" | "scsi" | "sata" | "nvme" | "ide"
nic_model = "virtio"     # "virtio" | "e1000e" | "rtl8139" | "vmxnet3"
# virtio_win_iso = "/srv/iso/drivers/virtio-win.iso"

[workspace]
# Virtual machines keep running when KVM Studio closes: libvirt and QEMU run them.
on_close = "keep"        # "keep" | "ask" | "suspend" | "shutdown"
close_reminder = true    # remind that VMs keep running (with "keep")

[ui]
theme = "system"         # "system" | "light" | "dark"
language = "en"          # "en" | "fr"
vm_tabs = true           # bar of the open VM tabs

# Send Key combinations (Preferences, Hotkeys). Without any [[hotkeys]] table
# the default list is used. Modifiers first (Ctrl, Alt, Shift, Win), then one
# key: a letter, a digit, F1 to F12, Delete, Escape, Tab, Enter, Backspace,
# Space, PrintScreen, Insert, Home, End, PageUp, PageDown, Up, Down, Left,
# Right or Pause. An empty name shows the keys.
# [[hotkeys]]
# name = "Run"
# keys = ["Win", "R"]
