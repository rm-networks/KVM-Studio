name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Same distribution packages as the development machine (python3-libvirt).
    container: fedora:44
    steps:
      - name: Install system packages
        run: dnf install -y --setopt=install_weak_deps=False git python3 python3-pip python3-libvirt qemu-img libvirt-client python3-pyqt6-webengine python3-QtPy

      - uses: actions/checkout@v5

      - name: Install the backend
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e "backend[dev]"

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy

      - name: Tests (libvirt test:///default driver)
        run: .venv/bin/pytest --cov --cov-report=term-missing --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
