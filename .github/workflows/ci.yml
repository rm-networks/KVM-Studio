name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    # Same distribution packages as the development machine (python3-libvirt).
    container: fedora:44
    steps:
      - name: Install system packages
        run: dnf install -y --setopt=install_weak_deps=False git python3 python3-pip python3-libvirt qemu-img xorriso libvirt-client python3-pyqt6-webengine python3-QtPy

      - uses: actions/checkout@v5

      - name: Install the backend
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e "backend[dev]" -e helper

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check
        run: .venv/bin/mypy

      - name: Tests (libvirt test:///default driver)
        run: .venv/bin/pytest --cov --cov-report=term-missing --cov-fail-under=70

  backend-debian:
    # The oldest Python packages among the supported distributions (Debian 13):
    # the tests run against them, nothing from PyPI but pywebview.
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install system packages
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-pip python3-fastapi python3-uvicorn python3-pydantic python3-websockets python3-lxml python3-tomli-w python3-argon2 python3-libvirt python3-pytest python3-httpx python3-bottle python3-typing-extensions qemu-utils xorriso libvirt-clients

      - uses: actions/checkout@v5

      - name: Tests with the distribution packages
        run: |
          pip install --break-system-packages --no-deps --target /tmp/vendor pywebview==6.2.1 proxy_tools==0.1.0
          PYTHONPATH=backend:helper:/tmp/vendor python3 -m pytest -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    # Interface tests in Chromium, against the backend on test:///default.
    runs-on: ubuntu-latest
    steps:
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y python3-libvirt python3-venv

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the backend
        run: |
          /usr/bin/python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -e backend

      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build && npx playwright install --with-deps chromium

      - name: Interface tests
        working-directory: frontend
        run: npm run e2e

  package:
    needs: [backend, backend-debian, frontend, e2e]
    runs-on: ubuntu-latest
    container: fedora:44
    env:
      NFPM_VERSION: 2.48.0
    steps:
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False git python3 python3-pip nodejs npm

      - uses: actions/checkout@v5

      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install nfpm
        run: |
          cd /tmp
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLO "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/checksums.txt"
          sha256sum -c --ignore-missing checksums.txt
          tar xzf "nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" nfpm
          install -m 755 nfpm /usr/local/bin/nfpm

      - name: Build the .rpm and the .deb
        run: |
          base=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'].split('.dev')[0])")
          case "$GITHUB_REF" in
            refs/tags/v*) export VERSION="${GITHUB_REF_NAME#v}" ;;
            *) export VERSION="${base}-dev.${GITHUB_RUN_NUMBER}" ;;
          esac
          python3 packaging/stage.py
          mkdir -p dist dist-upgrade
          nfpm package -f packaging/nfpm.yaml -p rpm -t dist/
          nfpm package -f packaging/nfpm.yaml -p deb -t dist/
          # An older .deb, to test an upgrade with dpkg.
          VERSION=0.0.1 nfpm package -f packaging/nfpm.yaml -p deb -t dist-upgrade/

      - name: Install and run the package
        run: |
          dnf install -y --setopt=install_weak_deps=False ./dist/kvm-studio-*.rpm
          .github/scripts/package-smoke.sh
          printf 'socket = "/tmp/h.sock"\n' > /tmp/h.toml
          /opt/kvm-studio/bin/kvmstudio-helper --config /tmp/h.toml &
          sleep 2
          python3 -c "import socket; s = socket.socket(socket.AF_UNIX); s.connect('/tmp/h.sock'); s.sendall(b'{\"op\": \"exec\", \"params\": {}}\n'); a = s.makefile().readline(); print(a); assert 'unknown_operation' in a"
          dnf remove -y kvm-studio
          test ! -e /opt/kvm-studio
          test ! -e /etc/kvm-studio
          test ! -e /var/lib/kvm-studio

      - uses: actions/upload-artifact@v4
        with:
          name: kvm-studio-rpm
          path: dist/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: kvm-studio-deb
          path: dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: kvm-studio-deb-older
          path: dist-upgrade/*.deb

  deb:
    # Install, upgrade with dpkg (settings and helper state kept) and purge.
    needs: [package]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["debian:13", "ubuntu:26.04"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: kvm-studio-deb
          path: new
      - uses: actions/download-artifact@v4
        with:
          name: kvm-studio-deb-older
          path: old

      - name: Install the older package
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ./old/*.deb
          dpkg -s kvm-studio | grep -q "^Version: 0.0.1"

      - name: State a user would have
        run: |
          mkdir -p /var/lib/kvm-studio
          echo '{"version": 1, "libraries": [], "acl": []}' > /var/lib/kvm-studio/helper-state.json
          echo '{}' > /var/lib/kvm-studio/port-forwards.json
          printf '\n[[iso_libraries]]\npath = "/srv/iso"\n' >> /etc/kvm-studio/helper.toml
          sha256sum /var/lib/kvm-studio/* /etc/kvm-studio/helper.toml > /tmp/before

      - name: Upgrade with dpkg -i
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          dpkg -i --force-confold ./new/*.deb
          dpkg -s kvm-studio | grep "^Version:"
          sha256sum -c /tmp/before
          kvm-studio --version
          /opt/kvm-studio/bin/kvmstudio-helper --help > /dev/null

      - name: Start the backend
        run: .github/scripts/package-smoke.sh

      - name: Purge
        run: |
          apt-get purge -y kvm-studio
          test ! -e /opt/kvm-studio
          test ! -e /etc/kvm-studio
          test ! -e /var/lib/kvm-studio

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kvm-studio-rpm
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: kvm-studio-deb
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the message of the annotated tag.
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .message > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.rpm dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "KVM Studio ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
