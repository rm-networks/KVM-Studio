[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kvmstudio-helper"
version = "0.1.0.dev0"
description = "Privileged helper of KVM Studio: a few named operations, authorized by polkit"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
# Runs as root: standard library only.
dependencies = []

[project.scripts]
kvmstudio-helper = "kvmstudio_helper.__main__:main"

[tool.setuptools.packages.find]
include = ["kvmstudio_helper*"]

[tool.setuptools.package-data]
kvmstudio_helper = ["py.typed"]
